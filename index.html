<style>
/* Layout: scorecard list that scrolls, turn panel pinned to the bottom of the screen */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f2f4f8; --line:#dce1e9;
  --fg:#18202c; --muted:#5d6878; --on-strong:#ffffff; --shadow:rgba(20,30,50,.10);
  --accent:#1f5fd6; --accent-soft:#e4ecfc;
  --good:#16833c; --good-soft:#e2f4e8;
  --bad:#c9302c; --bad-soft:#fbe8e7;
  --warn:#d06d10; --warn-soft:#fdf0e1;
  --purple:#7a3fc4; --key:#2a3341;
  --gold:#a56600; --gold-2:#b4500f;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --line:#2c3644;
  --fg:#e8edf4; --muted:#9aa6b6; --shadow:rgba(0,0,0,.45);
  --accent:#6f9dff; --accent-soft:#1b2a45; --good:#3fb96c; --good-soft:#15301f;
  --bad:#e9554e; --bad-soft:#3a1a19; --warn:#e48d33; --warn-soft:#3a2813;
  --purple:#b892ff; --key:#35404f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --line:#2c3644;
  --fg:#e8edf4; --muted:#9aa6b6; --shadow:rgba(0,0,0,.45);
  --accent:#6f9dff; --accent-soft:#1b2a45; --good:#3fb96c; --good-soft:#15301f;
  --bad:#e9554e; --bad-soft:#3a1a19; --warn:#e48d33; --warn-soft:#3a2813;
  --purple:#b892ff; --key:#35404f; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--ui)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed}

.app{max-width:760px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:14px 12px}
h1{font:700 26px/1 var(--num);margin:0;letter-spacing:.01em}
h1 span{color:var(--muted);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tool svg{width:16px;height:16px}
.tool.undo:not(:disabled){background:var(--warn);border-color:transparent;color:var(--on-strong)}
.tool.redo:not(:disabled){background:var(--good);border-color:transparent;color:var(--on-strong)}
.tool:disabled{opacity:.45}
.tool.danger{background:var(--bad);border-color:transparent;color:var(--on-strong)}

/* Winner */
.win{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-strong);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:10px;text-align:center}
.win h2{margin:0;font:700 24px/1.15 var(--num);text-wrap:balance}
.win .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.win button{height:46px;padding:0 16px;border-radius:12px;border:0;font-weight:700;font-size:15px}
.win .replay{background:var(--on-strong);color:var(--gold-2)}
.win .fresh{background:rgba(0,0,0,.28);color:var(--on-strong)}

/* Score rows */
.list{flex:1;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
  scroll-margin-bottom:calc(var(--panel-h,280px) + 12px);scroll-margin-top:12px}
.row.active{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 13px}
.who{flex:1;min-width:0}
.namewrap{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;visibility:hidden}
.row.active .dot{visibility:visible;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.name{font:600 17px var(--ui);color:var(--fg);background:transparent;border:0;border-bottom:1px dashed transparent;
  width:100%;min-width:0;padding:2px 0;border-radius:0}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;margin-top:2px;padding-left:18px}
.last{color:var(--purple);font-weight:600}
.hint{color:var(--muted)}
.nums{display:flex;gap:16px;text-align:right;flex:none}
.num small{display:block;font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num b{display:block;font:700 26px/1.1 var(--num);font-variant-numeric:tabular-nums;min-width:4.4ch}
.num.rem b{color:var(--accent)}
.row.won .num b{color:var(--good)}

/* Turn panel (pinned) */
.panel{position:sticky;bottom:0;margin-inline:-16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px var(--shadow)}
.msg{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1.5px solid;font-size:14px;line-height:1.35}
.msg strong{display:block;font-size:15px}
.msg svg{flex:none;width:20px;height:20px;margin-top:1px}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)} .msg.bad svg{color:var(--bad)}
.msg.warn{background:var(--warn-soft);border-color:var(--warn)} .msg.warn svg{color:var(--warn)}
.turnline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.turnline > div{min-width:0}
.label{font-size:13px;color:var(--muted);margin-bottom:2px}
.label b{color:var(--fg)}
.turn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 34px/1.15 var(--num);font-variant-numeric:tabular-nums}
.base{color:var(--accent)}
.stolen{display:inline-flex;align-items:center;gap:7px;color:var(--fg);background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:10px;padding:0 10px}
.stolen small{font:700 11px var(--ui);letter-spacing:.1em;color:var(--accent)}
.stolen svg{width:14px;height:14px;color:var(--accent)}
.plus{color:var(--good)}
.plus.zero{color:var(--muted);opacity:.6}
.total{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.total b{color:var(--fg);font:700 16px var(--num);font-variant-numeric:tabular-nums}
.clear{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14px;flex:none}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.key{height:52px;border-radius:12px;border:0;background:var(--key);color:var(--on-strong);font:700 17px var(--num);font-variant-numeric:tabular-nums;transition:transform .08s}
.key:active:not(:disabled){transform:scale(.95)}
.key.vol{background:var(--accent);letter-spacing:.06em}
.key.vol.pulse{animation:volpulse .5s ease-in-out 4}
@keyframes volpulse{50%{transform:scale(1.08);box-shadow:0 0 0 4px var(--accent-soft)}}
.tool.sound{padding:0 10px}
.tool.sound svg{width:18px;height:18px}
.tool.icon{width:38px;padding:0;justify-content:center}
.tool.icon svg{width:18px;height:18px}
.volhint{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:13px;line-height:1.3;color:var(--muted)}
.volhint svg{flex:none;width:14px;height:14px;color:var(--warn)}
.key.vol:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{height:54px;border-radius:12px;border:0;font-weight:700;font-size:17px;color:var(--on-strong)}
.pass{background:var(--bad)}
.ok{background:var(--good)}
.ok:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---- Mode dés ---- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.mode{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:700;font-size:15px}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.dice-wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.reroll{height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--good);color:var(--on-strong);font-weight:700;font-size:16px;flex:none;box-shadow:0 2px 0 var(--shadow);transition:transform .08s}
.reroll:active:not(:disabled){transform:scale(.95)}
.reroll:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.topctr{display:flex;align-items:center;gap:8px;flex:none}
.diceleft{height:46px;padding:0 12px;border-radius:12px;background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent);
  font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;white-space:nowrap}
.dstate{font-size:13px;color:var(--muted);line-height:1.4}
.dstate b{color:var(--fg)}
.dturn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dturn .dlab{font:700 12px var(--ui);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.dturn .damt{font:700 30px var(--num);font-variant-numeric:tabular-nums;color:var(--accent)}
.dturn .dgain{font:700 15px var(--num);color:var(--good);font-variant-numeric:tabular-nums}
.dboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:10px}
.die{aspect-ratio:1;border-radius:12px;background:var(--on-strong);color:var(--fg);display:flex;align-items:center;justify-content:center;
  font-size:44px;line-height:1;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--shadow);transition:transform .1s;min-height:48px}
.die.rollin{overflow:hidden}
.die.kept{background:var(--surface);font-weight:700}
.die.gray{background:var(--surface-2);color:var(--muted);opacity:.55}
.die.dead{background:var(--surface-2);color:var(--muted);opacity:.5}
.dhint{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.35}
.drow-lost .num b{color:var(--bad)}
.dmsgs{margin-bottom:8px}
.dmsg{border-radius:10px;padding:9px 11px;border:1.5px solid;font-size:13px;line-height:1.35;margin-bottom:6px}
.dmsg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dmsg.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.dmsg.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dsub{font-size:13px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.dsub b{color:var(--fg)}
.dgrid{display:block;margin-bottom:8px}
.dgrid .die{padding:12px;min-width:48px}
.dgrid small{display:block;font:700 12px var(--num);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.dgrid .dgroup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.dgrid .div{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dgrid .div .die{flex:1 1 30%;min-width:48px;max-width:76px}
.des-log{margin-top:6px}
.des-log summary{font-weight:600;font-size:14px;cursor:pointer;color:var(--accent);padding:4px 0}
.dlogrow{display:grid;grid-template-columns:2em 1fr auto 4.2em;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.dlogrow .ln{font:600 12px var(--num);color:var(--muted)}
.dlogrow .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlogrow .lv{text-align:right;font-weight:600;color:var(--good);white-space:nowrap}
.dlogrow .lv.vol{color:var(--purple)}
.dlogrow .lv.none{color:var(--muted);font-weight:500}
.dlogrow .ls{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums}
.dloghead{font-size:12px;color:var(--muted);margin:4px 0 8px;letter-spacing:.02em}
.djetrow{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto auto 3.4em;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.djetrow .ln{font:600 12px var(--num);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.djetrow .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.djetrow .ddice-mini{font:700 15px var(--num);letter-spacing:.06em;color:var(--fg);white-space:nowrap}
.djetrow .lv{text-align:right;font-weight:600;color:var(--good);white-space:nowrap}
.djetrow .lv.vol{color:var(--purple)}
.djetrow .lv.none{color:var(--bad);font-weight:600}
.djetrow .lv.lv{color:var(--fg)}
.djetrow .ls{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums;color:var(--accent)}
.dvn{display:flex;align-items:baseline;gap:6px}
.dvn b{font:700 18px var(--num);color:var(--accent)}
.dvn span{font-size:13px;color:var(--muted)}

/* Setup */
.setup{margin:auto;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;
  display:flex;flex-direction:column;gap:20px;margin-block:24px}
.setup h1{font-size:34px;text-align:center}
.setup h2{font-size:15px;margin:0 0 10px;font-weight:600}
.count{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.count button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 20px var(--num)}
.count button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.rules{margin:0;padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:14px;line-height:1.6;color:var(--muted);list-style:none}
.rules b{color:var(--fg);font-family:var(--num);font-variant-numeric:tabular-nums}
.version{margin:-8px 0 0;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.go{height:56px;border-radius:14px;border:0;background:var(--good);color:var(--on-strong);font-weight:700;font-size:18px}
.go.danger{background:var(--bad)}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);
  border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;color:var(--fg);
  transition:transform .08s}
.resume:active{transform:scale(.985)}
.resume .rt{flex:1;min-width:0}
.resume b{display:block;font-size:15px;color:var(--accent)}
.resume small{display:block;margin-top:2px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume svg{flex:none;width:18px;height:18px;color:var(--accent)}

/* Journal des tours */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-top h2{margin:0;font:700 20px var(--num)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.loghead,.logrow{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto 4.2em;gap:8px;align-items:baseline}
.loghead{padding:10px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.loghead span:nth-child(3),.loghead span:nth-child(4){text-align:right}
.logrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.logrow .ln{font:600 12px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.logrow .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .lv{text-align:right;font-weight:600;color:var(--good);white-space:nowrap}
.logrow .lv.vol{color:var(--purple)}
.logrow .lv.none{color:var(--muted);font-weight:500}
.logrow .ls{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

@media (max-width:400px){
  .num b{font-size:22px} .nums{gap:12px} .key{font-size:15px;height:50px} .turn{font-size:30px}
  .tool{padding:0 10px}
}
@media (max-width:380px){.nj{display:none} .nums{gap:10px}}
@media (prefers-reduced-motion:reduce){.key.vol.pulse{animation:none}.row.active .dot{animation:none}.key{transition:none}}
</style>

<div id="root"></div>

<script>
/* 20K — moteur de règles.
 *
 * Pur : aucune dépendance au DOM, au stockage, au son ou au réseau.
 * Utilisé tel quel par l'interface web, et plus tard par le serveur du mode
 * « salon » (chaque appareil envoie des actions, tout le monde rejoue avec ce
 * même fichier : impossible de diverger).
 *
 * État du jeu :
 *   {
 *     names:   ["Marie", ...],
 *     players: [{ score, last, started }, ...],
 *     current: 2,                      // index du joueur dont c'est le tour
 *     prevTurn:{ player, points } | null,  // dernier tour qui a marqué (source du vol)
 *     winner:  1 | null,
 *     turn:    { stolen, add },        // saisie en cours
 *     log:     [{ i, n, add, stolen, total, after, pass }, ...],
 *     past:    [snapshot, ...],        // annulation
 *     future:  [snapshot, ...]         // rétablissement
 *   }
 *
 * reduce(état, action) renvoie { state, error?, events? } et ne modifie jamais
 * l'état reçu.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var TARGET = 20000, MIN_OPEN = 1000, MIN_VOL = 3500;
  var SAY_REMAINING = 1500;  // la voix annonce le reste à 1 500 ou moins
  var VOL_SOUND_MIN = 1000;  // sirène seulement pour un vol de 1 000 et plus
  var STEPS = [50, 100, 200, 500, 1000];
  var HISTORY_MAX = 300;

  var fmt = function (n) { return Number(n).toLocaleString('fr-CA'); };
  var freshTurn = function () { return { stolen: 0, add: 0 }; };

  function createGame(names) {
    names = (names || []).map(function (n) { return String(n); });
    return {
      names: names,
      players: names.map(function () { return { score: 0, last: null, started: false }; }),
      current: 0, prevTurn: null, winner: null,
      turn: freshTurn(), log: [], past: [], future: []
    };
  }

  function nextIdx(s, i) { return (i + 1) % s.players.length; }

  // Le vol ne vise que le tour qui vient de se terminer, et il faut encore de la
  // place pour les points volés plus les 50 obligatoires.
  function volFits(s) {
    return !!s.prevTurn &&
      s.players[s.current].score + s.prevTurn.points + STEPS[0] <= TARGET;
  }

  function canVol(s) {
    var p = s.players[s.current], t = s.prevTurn;
    return s.winner === null && !s.turn.stolen && p.score >= MIN_VOL &&
      !!t && t.points > 0 && t.player !== s.current && volFits(s);
  }

    var prevTurn = (raw.prevTurn && isNum(raw.prevTurn.player) && isNum(raw.prevTurn.points))
      ? { player: raw.prevTurn.player, points: raw.prevTurn.points } : null;
    var winner = isNum(raw.winner) && raw.winner >= 0 && raw.winner < players.length ? raw.winner : null;

      prevTurn: prevTurn, winner: winner, turn: turn,
      log: Array.isArray(raw.log) ? raw.log.filter(function (e) { return e && isNum(e.n); }) : [],
      past: Array.isArray(raw.past) ? raw.past.filter(function (x) { return x && Array.isArray(x.players); }) : [],
      future: Array.isArray(raw.future) ? raw.future.filter(function (x) { return x && Array.isArray(x.players); }) : []

    STEPS: STEPS, HISTORY_MAX: HISTORY_MAX,

<script>
/* 20K — moteur des DÉS (6 dés).
 *
 * Pur : aucune dépendance au DOM, au stockage, au son ou au réseau.
 * Règles issues de SPEC-des.md (dictées par l'auteur, verrouillées 2026-11-21).
 *
 * La règle la plus importante : les combinaisons ne se forment que DANS UN MÊME
 * lancer. Les dés gardés d'un lancer antérieur gardent leur valeur unitaire,
 * ils ne se recombinent jamais avec les nouveaux. Le tour cumule les scores

  var UNIT_5 = 50;    // chaque 5 = 50

  var TROIS_PAIRES = 1000; // 3 paires différentes en un seul lancer

  // Score minimal pour qu'un vol "compte" (dés restants du joueur précédent).
  var VOL_MIN = 50;
  // Seuil à partir duquel on POSSÈDE le droit de voler.
  var VOL_PASSEPORT = 3500;

  // Suite 1-2-3-4-5-6 ?
  function suite(dice) {
    if (dice.length !== 6) return null;
    var s = sorted(dice);
    return sameVals(s, [1, 2, 3, 4, 5, 6]) ? { points: SUITE, name: 'suite', dice: dice.slice() } : null;
  }

  function troisPaires(dice) {

    var best = null, bestN = 0;

    var base = best === 1 ? 1000 : best * 100;
    // chaque dé supplémentaire (au-delà de 3) double le total.
    var points = base;

    return { face: best, count: bestN, base: base, points: points, name: 'brelan' };

  function scoreDice(values) {

    var s = suite(dice);

      var toRemove = {};

      // retire les g.count dés de la face g.face

      var kept = [];
      remaining.forEach(function (d) {

      // les 1 et 5 restants (hors brelan) s'ajoutent comme unités libres.
      var units = 0;
      kept.forEach(function (d) { units += (d === 1 ? UNIT_1 : d === 5 ? UNIT_5 : 0); });

      g.unitsAdded = units;
      return g;
    }

    // Sinon, pas de combinaison : seulement les unités 1 et 5.
    var p = 0;
    var n1 = 0, n5 = 0;
    dice.forEach(function (d) {
      if (d === 1) { p += UNIT_1; n1++; }
      else if (d === 5) { p += UNIT_5; n5++; }
    });
    if (p === 0) return { points: 0, name: 'rien', dice: dice.slice() };
    return { points: p, name: 'unites', n1: n1, n5: n5, dice: dice.slice() };

  }

  return {
    UNIT_1: UNIT_1, UNIT_5: UNIT_5, SUITE: SUITE, TROIS_PAIRES: TROIS_PAIRES,
    VOL_MIN: VOL_MIN, VOL_PASSEPORT: VOL_PASSEPORT,
    scoreDice: scoreDice, compteDansVol: compteDansVol

});

<script>
/* 20K — logique du TOUR aux dés (par-dessus engine-dice).
 *
 * Pur : aucune dépendance au DOM, au stockage, au son ou au réseau.
 *
 * Un tour est une suite de lancers sur 6 dés :
 *   - on lance des dés, on évalue le lancer (engine-dice.scoreDice),
 *   - on GARDE les dés qui rapportent (1, 5, ou les dés d'une combinaison),
 *   - les dés inutiles sont relancés (on ne garde JAMAIS un dé qui ne rapporte rien),
 *   - tant que le tour n'a pas accumulé 1000 on ne peut PAS s'arrêter,
 *   - un lancer sans aucun point = perte totale de ce qui était accumulé.
 *
 * États d'un tour :
 *   { type:'rolling', inHand:[...], kept:[...], score, canStop, lancers }
 *   { type:'banked', total, lancers }
 *   { type:'perdu', total:0, lancers }          // jet sans point
 *   { type:'blocked' }                          // stop non autorisé (< 1000)
 *
 * Le moteur est DÉTERMINISTE : on passe les "dés" en paramètre (pour les tests)
 * ou on les fait générer (rollN). Une fonction pure `resolve(nextHand)` N'avance
 * le tour qu'en fonction de l'état ET du prochain lancer fourni.
 */

  else root.TurnDice = factory(root);
})(typeof globalThis !== 'undefined' ? globalThis : this, function (root) {
  'use strict';
  var D = (typeof require !== 'undefined') ? require('./engine-dice.js') : root.DiceEngine;

  var OUVRAGE = 1000;
  var DES = 6;
  var VOL_PASSEPORT = D.VOL_PASSEPORT || 3500; // seuil pour avoir droit au vol

  // ---- Helpers ------------------------------------------------------------
  function rollN(n, nextInt) {
    var rnd = nextInt || function () { return 1 + Math.floor(Math.random() * 6); };
    var out = [];

});

      });
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // Mode actif (tableau vs dés), stocké à part pour redevenir le bon écran au
  // prochain lancement même sans partie tableau en cours.
  const KEY_MODE = '20k-scorecard-mode';
  let MODE = 'tab';
  try { MODE = localStorage.getItem(KEY_MODE) === 'des' ? 'des' : 'tab'; } catch (e) {}
  function saveMode() { try { localStorage.setItem(KEY_MODE, MODE); } catch (e) {} }

  let S = load() || fresh();
  let msg = null, msgTimer = 0;
  let confirmNew = false, confirmStart = false, confirmTimer = 0;
  let pulseVol = false;
  let sheet = null; // 'log' when the turn history is open

  // ---- Mode dés (état de partie distinct, clé localStorage « -des ») --------
  function freshDes() {
    return {
      screen: 'setup-des', count: 4, names: [], players: [],
      current: 0, winner: null, prevTurn: null,
      turn: null, phase: 'idle', steal: null, log: [], keptByRoll: [],
      gameId: 1, jetLog: []
    };
  }
  function loadDes() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY_DES));
      if (!raw || !raw.screen) return null;
      const d = freshDes();
      const players = Array.isArray(raw.players) ? raw.players.map(p =>
        (!p || typeof p.score !== 'number') ? { score: 0, last: null } : {
          score: p.score, last: typeof p.last === 'number' ? p.last : null }) : [];
      if (!(raw.screen === 'game-des') || !players.length) return d;
      d.screen = 'game-des';
      d.players = players;
      d.names = Array.isArray(raw.names) ? raw.names.map((n, i) => (typeof n === 'string' && n.trim()) ? n : 'Joueur ' + (i + 1)) : [];
      d.count = Array.isArray(raw.names) ? raw.names.length : (typeof raw.count === 'number' ? raw.count : 4);
      d.current = Number.isInteger(raw.current) && raw.current >= 0 && raw.current < players.length ? raw.current : 0;
      d.winner = Number.isInteger(raw.winner) && raw.winner >= 0 && raw.winner < players.length ? raw.winner : null;
      d.prevTurn = (raw.prevTurn && Number.isInteger(raw.prevTurn.player) && typeof raw.prevTurn.gain === 'number')
        ? { player: raw.prevTurn.player, gain: raw.prevTurn.gain, leftoverDice: Array.isArray(raw.prevTurn.leftoverDice) ? raw.prevTurn.leftoverDice : [] }
        : null;
      d.turn = raw.turn || null;
      d.phase = raw.phase === 'normal' || raw.phase === 'steal' ? raw.phase : 'idle';
      d.steal = null;
      d.log = Array.isArray(raw.log) ? raw.log.filter(e => e && typeof e.n === 'number') : [];
      d.keptByRoll = Array.isArray(raw.keptByRoll) ? raw.keptByRoll.filter(g => g && Number.isInteger(g.jet)) : [];
      d.gameId = Number.isInteger(raw.gameId) ? raw.gameId : 1;
      d.jetLog = Array.isArray(raw.jetLog) ? raw.jetLog.filter(e => e && typeof e.n === 'number') : [];
      return d;
    } catch (e) {}
    return null;
  }
  function saveDes() { try { localStorage.setItem(KEY_DES, JSON.stringify(DS)); } catch (e) {} }
  let DS = loadDes() || freshDes();
  const inDesMode = () => MODE === 'des' && (DS.screen === 'setup-des' || DS.screen === 'game-des');

  // ---- Actions du mode dés -----------------------------------------------
  const dNext = i => (i + 1) % DS.players.length;

  function dAdvance() {
    const p = DS.players[DS.current];
    if (p.score === DES_TARGET) DS.winner = DS.current;
    else DS.current = dNext(DS.current);
  }
  function dBank(production, leftoverDice) {
    const p = DS.players[DS.current];
    const isSteal = DS.phase === 'steal';
    const gain = isSteal ? DS.steal.gainToSteal : 0;   // gain volé (copie, rien ne change sur le volé)
    const bank = gain + production;
    if (p.score + bank > DES_TARGET) {
      flash('bad', 'Score trop élevé', 'Ça dépasserait ' + E.fmt(DES_TARGET) + '. Il faudrait encaisser exactement ' + E.fmt(DES_TARGET - p.score) + '.');
      saveDes(); render();
      return;
    }
    // Dés restants du joueur = ceux de son dernier lancer non gardés (source du vol).
    const leftover = (leftoverDice || []).filter(d => d >= 1 && d <= 6);
    p.score += bank; p.last = bank;
    DS.prevTurn = { player: DS.current, gain: bank, leftoverDice: leftover };
    DS.log.push({
      i: DS.current, n: DS.log.length + 1,
      add: production, stolen: gain, total: bank,
      pass: false, after: p.score
    });
    // Historique : on consigne l'encaissement (vol ou normal) pour validation ultérieure.
    const wasVol = gain > 0;
    DS.jetLog.push({
      v: VERSION, g: DS.gameId, n: DS.log.length, t: Date.now(), p: DS.current, j: -1,
      dice: [], gained: bank, cumul: bank, comb: wasVol ? 'vol' : 'bank', kind: wasVol ? 'vol-bank' : 'bank'
    });
    dAdvance();
    if (DS.winner !== null) {
      if (S.sound !== false) { victory(); say(DS.names[DS.winner] + ' gagne avec ' + E.fmt(DES_TARGET) + ' points!', null); }
    }
    DS.turn = null; DS.phase = 'idle'; DS.steal = null;
    return { wasVol, gain, bank };
  }
  function dLose() {
    const st = DS.turn;
    const wasSteal = DS.phase === 'steal';
    DS.log.push({ i: DS.current, n: DS.log.length + 1, add: 0, stolen: 0, total: 0, pass: true, after: DS.players[DS.current].score });
    // Une perte efface l'occasion de vol (comme « Aucun point » au tableau).
    DS.prevTurn = null;
    dAdvance();
    DS.turn = null; DS.phase = 'idle'; DS.steal = null;
    return { wasSteal };
  }
  // Enregistre chaque lancer (jet) pour l'historique consultable / exportable.
  // kind : 'roll' (jet normal), 'perdu', 'bank' (encaissé), 'vol' (jet en phase de vol)
  function recordJet(kind, extra) {
    const st = DS.turn;
    const rollNum = (st && st.lancers) || 0;
    const dice = (st && (Array.isArray(st.handLost) ? st.handLost : st.inHand)) || [];
    DS.jetLog.push({
      v: VERSION,                // version du logiciel (pour validation)
      g: DS.gameId,              // numéro de partie
      n: DS.log.length + 1,      // numéro de tour
      t: Date.now(),             // horodatage
      p: DS.current,             // joueur
      j: rollNum,                // numéro de lancer dans le tour
      dice: dice,                // les dés jetés
      color: jetColor(rollNum),  // couleur de ce jet (pour l'affichage/export)
      gained: (st && st.gained) || 0,          // points du lancer
      cumul: (st && st.score) || (st && st.total) || 0,  // total du tour
      comb: (st && st.combinaison) || (extra && extra.comb) || '',
      kept: (st && st.kept) || [],
      kind: kind
    });
  }
  function resetJetLog() { DS.jetLog = []; }
  function dVolOffer() {
    if (DS.phase !== 'idle' || DS.turn) return false;   // seulement avant le lancer d'un tour
    if (DS.screen !== 'game-des') return false;
    if (DS.winner !== null) return false;
    const p = DS.players[DS.current];
    const vt = DS.prevTurn;
    if (!vt || vt.gain <= 0 || vt.player === DS.current) return false;
    if (!vt.leftoverDice || vt.leftoverDice.length === 0) return false;
    return T.canVol(p.score, vt.gain, 0, DES_TARGET);
  }
  function dStealReason() {
    if (DS.phase !== 'idle') return '';
    const p = DS.players[DS.current];
    const vt = DS.prevTurn;
    if (!vt || vt.gain <= 0) return 'Aucun gain à voler';
    if (vt.player === DS.current) return '';
    if (!vt.leftoverDice || vt.leftoverDice.length === 0) return 'Le joueur a consommé tous ses dés';
    if (p.score < T.VOL_PASSEPORT) return 'Nécessite ' + E.fmt(T.VOL_PASSEPORT) + ' points minimum';
    if (T.canVol(p.score, vt.gain, 0, DES_TARGET)) return '';
    return 'Pas assez de place pour voler ' + E.fmt(vt.gain) + ' + 50';
  }

  function dAct(a, v) {
    switch (a) {
      case 'godes':      // depuis l'accueil tableau -> mode dés
        MODE = 'des'; saveMode();
        if (!DS.screen || DS.screen === 'setup-des') DS.screen = 'setup-des';
        break;
      case 'gotab':      // depuis le mode dés -> mode tableau
        MODE = 'tab'; saveMode();
        S.screen = 'setup';
        break;
      case 'count': DS.count = +v; break;
      case 'start': {
        const n = DS.count;
        DS.names = Array.from({ length: n }, (_, i) => DS.names[i] || `Joueur ${i + 1}`);
        DS.players = DS.names.map(nm => ({ score: 0, last: null }));
        DS.names = DS.names.slice(0, n);
        DS.current = 0; DS.winner = null; DS.prevTurn = null;
        DS.turn = null; DS.phase = 'idle'; DS.steal = null; DS.log = []; DS.keptByRoll = [];
        DS.jetLog = [];
        if (DS.gameId <= 0) DS.gameId = 1;
        DS.screen = 'game-des';
        break;
      }
      case 'lancier': {   // début de tour normal (renonce au vol)
        DS.turn = T.start(T.fresh());
        DS.phase = 'normal';
        DS.keptByRoll = [];   // le 1er jet s'affiche via la main courante
        if (DS.turn.type === 'rolling') recordJet('roll');
        break;
      }
      case 'rolldes': {   // relancer les dés non gardés
        const st = DS.turn;
        if (!st || st.type !== 'rolling') break;
        // Quand le jet précédent a rapporté sur TOUS ses dés (allScored), la
        // relance rejoue les 6 dés : AUCUN dé n'est tenu, on vide keptByRoll.
        // Sinon, les dés gardés de ce jet deviennent « tenus » (colorés par jet).
        const prevAllScored = !!st.allScored;
        const prevKept = (st.kept || []);
        const prevJet = st.lancers || 1;
        DS.turn = T.roll(st);
        if (DS.turn.type === 'perdu') { recordJet('perdu'); break; }
        recordJet('roll');
        if (prevAllScored) {
          DS.keptByRoll = [];
        } else if (prevKept.length) {
          DS.keptByRoll.push({ jet: prevJet, dice: prevKept });
        }
        break;
      }
      case 'dasser': {   // après un tour perdu, passer au joueur suivant (sans son)
        if (DS.turn && DS.turn.type === 'perdu') dLose();
        break;
      }
      case 'stopdes': {   // encaisser
        const st = DS.turn;
        if (!st || st.type !== 'rolling') break;
        const leftover = (st.toRoll || []).slice();
        if (DS.phase === 'steal') {
          if (st.score < DES_VOL_MIN_PROD) break;   // il faut au moins 50 produits
          DS.turn = st;                              // conserve le rolling pour le log/renvoi
          dBank(st.score, leftover);
        } else {
          const playerStarted = (DS.players[DS.current].score > 0);
          const threshold = playerStarted ? 1 : T.OUVRAGE;   // 1000 seulement au 1er score
          if (st.score < threshold) break;
          const production = st.score;
          // Validation via le moteur pour le 1er score (exige 1000) ; sinon,
          // un joueur déjà ouvert peut encaisser dès 1 point (l'état banked est
          // simplement fabriqué sans recoder les règles de scoring).
          let banked;
          if (playerStarted) {
            banked = { type: 'banked', total: st.score, lancers: st.lancers, kept: st.kept };
          } else {
            banked = T.stop(st);
          }
          if (!banked || banked.type !== 'banked') break;
          DS.turn = banked;
          dBank(production, leftover);
        }
        break;
      }
      case 'volerd': {    // démarrer une phase de vol sur les dés restants du précédent
        const vt = DS.prevTurn;
        if (!dVolOffer() || !vt) break;
        DS.steal = { sourcePlayer: vt.player, gainToSteal: vt.gain, leftoverDice: vt.leftoverDice };
        DS.turn = T.start(T.fresh(), vt.leftoverDice);
        DS.phase = 'steal';
        DS.keptByRoll = [];   // le 1er jet de vol s'affiche via la main courante
        if (DS.turn.type === 'rolling') recordJet('vol');
        break;
      }
      case 'dresume':    // reprendre la partie aux dés en cours
        DS.screen = 'game-des';
        break;
      case 'desnew': {   // nouvelle partie aux dés -> écran de configuration
        DS.screen = 'setup-des';
        DS.turn = null; DS.phase = 'idle'; DS.steal = null; DS.keptByRoll = [];
        if (DS.winner !== null) {  // après une victoire on repasse par l'écran de config
          DS.players = []; DS.names = []; DS.winner = null; DS.prevTurn = null; DS.log = [];
        }
        break;
      }
      case 'sound':
        S.sound = S.sound === false; save(); break;
      case 'deslog': {   // exporter l'historique des jets (validation)
        try {
          const blob = JSON.stringify({ app: VERSION, exportedAt: new Date().toISOString(), jets: DS.jetLog }, null, 2);
          const d = document.createElement('textarea'); d.value = blob; document.body.appendChild(d); d.select();
          let copied = false;
          try { copied = document.execCommand('copy'); } catch (e) {}
          if (navigator.clipboard && navigator.clipboard.writeText && !copied) {
            navigator.clipboard.writeText(blob).catch(() => {});
            copied = true;
          }
          document.body.removeChild(d);
          flash('good', 'Historique copié', 'Le détail des jets (version ' + VERSION + ') a été copié dans le presse-papier.');
        } catch (e) { flash('warn', 'Export', 'Impossible de copier l\'historique.'); }

      }

    }
    saveDes(); render();
  }

  // ---- Sounds: fanfare (a team reaches 3 500 = can steal from now on), siren (steal of 1 000+), buzzer (steal won't fit) ----
  let actx = null;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function audio() {
    try {
      if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function siren() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03, dur = 1.6;
      const osc = a.createOscillator(), lp = a.createBiquadFilter(), gain = a.createGain();
      osc.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 2200;
      osc.frequency.setValueAtTime(650, t);
      for (let i = 0; i < 2; i++) {
        osc.frequency.linearRampToValueAtTime(1150, t + i * 0.8 + 0.4);
        osc.frequency.linearRampToValueAtTime(650, t + i * 0.8 + 0.8);
      }
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.2, t + 0.05);
      gain.gain.setValueAtTime(0.2, t + dur - 0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(lp); lp.connect(gain); gain.connect(a.destination);
      osc.start(t); osc.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function tone(a, type, freq, start, dur, vol) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    g.gain.setValueAtTime(vol, start + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(a.destination); o.start(start); o.stop(start + dur + 0.02);
  }
  function fanfare() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      [[523.25, 0, .14], [659.25, .14, .14], [783.99, .28, .14], [1046.5, .42, .55]].forEach(([f, st, d]) => {
        tone(a, 'square', f, t + st, d, 0.12); tone(a, 'triangle', f * 2, t + st, d, 0.05);
      });
    } catch (e) {}
  }
  function buzzer() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      tone(a, 'sawtooth', 110, t, 0.8, 0.22); tone(a, 'square', 116, t, 0.8, 0.12);
    } catch (e) {}
  }
  // Winner: rising arpeggio, held chord, then a low root under it.
  function victory() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      [[523.25, 0, .16], [659.25, .16, .16], [783.99, .32, .16], [1046.5, .48, .42],
       [1318.5, .94, .14], [1567.98, 1.08, .14]].forEach(([f, st, d]) => {
        tone(a, 'square', f, t + st, d, 0.12); tone(a, 'triangle', f * 2, t + st, d, 0.05);
      });
      [[1046.5, 1.24, 1.15], [1318.5, 1.24, 1.15], [1567.98, 1.24, 1.15]].forEach(([f, st, d]) => {
        tone(a, 'triangle', f, t + st, d, 0.09);
      });
      tone(a, 'sine', 261.63, t + 1.24, 1.15, 0.12);
    } catch (e) {}
  }
  // Called when a new turn starts after a score.
  function volAlert() {
    const p = S.players[S.current], t = S.prevTurn;
    if (!t || t.points <= 0 || t.player === S.current || p.score < MIN_VOL) return;
    if (!E.volFits(S)) return buzzer;
    pulseVol = true;
    if (t.points >= VOL_SOUND_MIN) return siren;
  }

  // ---- Voice: French female voice (Amélie on iPhone/iPad when available) ----
  let frVoice = null;
  function pickVoice() {
    try {
      const fr = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
      const pref = ['Amélie', 'Amelie', 'Audrey', 'Aurélie', 'Marie', 'Julie', 'Céline', 'Chantal', 'Sylvie', 'Hortense', 'Denise', 'Google français'];
      frVoice = pref.map(n => fr.find(v => v.name.includes(n))).find(Boolean)
        || fr.find(v => /fr-CA/i.test(v.lang)) || fr[0] || null;
    } catch (e) { frVoice = null; }
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { speechSynthesis.onvoiceschanged = pickVoice; }
  }
  // iOS only lets a page speak once speech has been started from a tap: do it silently on the first tap.
  let speechUnlocked = false, utt = null;
  function unlockSpeech() {
    if (speechUnlocked || !('speechSynthesis' in window)) return;
    speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; utt = u; speechSynthesis.speak(u); } catch (e) {}
  }
  function say(text, then) {
    let done = false;
    const fin = () => { if (!done) { done = true; if (then) then(); } };
    if (S.sound === false || !('speechSynthesis' in window)) { fin(); return; }
    try {
      if (!frVoice) pickVoice();
      try { speechSynthesis.resume(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(text);
      utt = u; // keep a reference so Safari doesn't drop it mid-sentence
      if (frVoice) { u.voice = frVoice; u.lang = frVoice.lang; } else u.lang = 'fr-CA';
      u.rate = 1; u.pitch = 1.1;
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 5000);
      speechSynthesis.speak(u);
    } catch (e) { fin(); }
  }

  function flash(kind, title, text) {
    msg = { kind, title, text };
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msg = null; render(); }, 3500);
  }

  function startGame(n) {
    Object.assign(S, E.createGame(S.names.slice(0, n)));
    S.screen = 'game';
    msg = null; sheet = null;
  }
  // A game that is in progress and could still be resumed from the setup screen.
  const resumable = () => S.players.length > 0 && S.winner === null;

  // Plays the sounds and the voice for a scored turn, in order:
  // victory -> fanfare (just reached 3 500) -> voice (1 500 or less left) -> steal sound for the next team.
  function playScored(ev) {
    const rem = TARGET - ev.after;
    const steps = [];
    if (ev.won) {
      steps.push(done => { victory(); setTimeout(done, 1700); });
      steps.push(done => say(`${S.names[ev.player]} gagne avec ${fmt(TARGET)} points!`, done));
    } else {
      if (ev.before < MIN_VOL && ev.after >= MIN_VOL) steps.push(done => { fanfare(); setTimeout(done, 1100); });
      if (rem <= SAY_REMAINING) steps.push(done => say(`${S.names[ev.player]}, il reste ${rem} points.`, done));
      const fx = volAlert();
      if (fx) steps.push(done => { fx(); done(); });
    }
    (function run() { const st = steps.shift(); if (st) st(run); })();
  }

  // ---- Actions -----------------------------------------------------------
  const GAME_ACTIONS = { add: 1, vol: 1, clear: 1, pass: 1, submit: 1, undo: 1, redo: 1 };

  function act(a, v) {
    let moved = false;
    pulseVol = false;

    if (GAME_ACTIONS[a]) {
      const r = E.reduce(S, { type: a, v: v === undefined ? undefined : +v });
      if (r.error) {
        flash(r.error.kind, r.error.title, r.error.text);
      } else {
        Object.assign(S, r.state);
        const ev = (r.events || [])[0];
        if (ev) {
          moved = true; msg = null;
          if (ev.type === 'scored') playScored(ev);
        }
      }
    } else {
      switch (a) {
        case 'sound':
          S.sound = S.sound === false;
          if (S.sound) say('Son activé', siren);
          break;
        case 'count': S.count = +v; break;
        case 'start':
          if (resumable() && !confirmStart) {
            confirmStart = true; clearTimeout(confirmTimer);
            confirmTimer = setTimeout(() => { confirmStart = false; render(); }, 3000);
            break;
          }
          confirmStart = false;
          S.names = Array.from({ length: S.count }, (_, i) => S.names[i] || `Joueur ${i + 1}`);
          startGame(S.count); break;
        case 'resume':
          confirmStart = false; S.screen = 'game'; msg = null; sheet = null; break;
        case 'replay': startGame(S.players.length || S.count); break;
        case 'log': sheet = 'log'; break;
        case 'closelog': sheet = null; break;
        case 'godes':      // depuis l'accueil tableau -> mode dés
        MODE = 'des'; saveMode();
        if (!DS.screen || DS.screen === 'setup-des') DS.screen = 'setup-des';
        break;
      case 'new':
          if (S.winner !== null || confirmNew) {
            confirmNew = false; S.count = S.players.length || S.count; S.screen = 'setup'; msg = null; sheet = null;
          } else {
            confirmNew = true; clearTimeout(confirmTimer);
            confirmTimer = setTimeout(() => { confirmNew = false; render(); }, 3000);
          }
          break;
      }
    }

    save(); render();
    if (moved) scrollToActive();
  }

  // ---- Rendering ---------------------------------------------------------
  const ICON = {
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
  };

  function viewSetup() {
    const counts = [2, 3, 4, 5, 6].map(n =>
      `<button data-a="count" data-v="${n}" aria-pressed="${S.count === n}">${n}</button>`).join('');
    const resume = resumable();
    const lead = S.players.slice(0, 4).map((p, i) =>
      `${esc(S.names[i] || 'Joueur ' + (i + 1))} ${fmt(p.score)}`).join(' · ');
    return `<div class="app"><div class="setup">
      <h1>20K <span>Scorecard</span></h1>
      <div class="modes">
        <button class="mode" aria-pressed="true">Tableau</button>
        <button class="mode" data-a="godes">Avec dés</button>
      </div>
      ${resume ? `<button class="resume" data-a="resume">
        <span class="rt"><b>Reprendre la partie en cours</b>
        <small>${lead}${S.players.length > 4 ? ' …' : ''}</small></span>${ICON.chev}
      </button>` : ''}
      <div><h2>Nombre de joueurs</h2><div class="count">${counts}</div></div>
      <ul class="rules">
        <li>Premier score : <b>${fmt(MIN_OPEN)}</b> minimum</li>
        <li>Vol permis à partir de <b>${fmt(MIN_VOL)}</b></li>
        <li>Objectif exact : <b>${fmt(TARGET)}</b></li>
      </ul>
      <button class="go${confirmStart ? ' danger' : ''}" data-a="start">${confirmStart ? 'Remplacer la partie en cours ?' : resume ? 'Nouvelle partie' : 'Commencer le jeu'}</button>
      <p class="version">Version ${VERSION}</p>
    </div></div>`;
  }

  // ---- Mode dés : rendu ---------------------------------------------------
  function dGlyph(v) { return DICE_GLYPH[v] || String(v); }

  // Affiche les dés : « tenus » (des jets antérieurs, colorés par jet) puis le
  // « lancer courant » (gardés = couleur du jet, à relancer = gris).
  // En idle (aucun lancer), on affiche un plateau fixe de 6 dés gris pour que
  // l'interface reste stable. En état perdu : les dés sans valeur en gris.
  function diceRow(st) {
    const die = (d) => d.kept
      ? `<span class="die kept" style="color:${jetColor(d.jet)};border-color:${jetColor(d.jet)}">${dGlyph(d.v)}</span>`
      : `<span class="die gray">${dGlyph(d.v)}</span>`;
    // Idle : plateau vide de 6 dés gris (fenêtre identique au lancer).
    if (!st) {
      const empty = Array.from({ length: 6 }, () => ({ v: 0, jet: 0, kept: false }));
      const cells = empty.map(d => `<span class="die gray">·</span>`).join('');
      return `<div class="dgrid"><div class="dgroup"><small>6 dés — appuie sur Lancer pour débuter</small><div class="div">${cells}</div></div></div>`;
    }
    const perdu = st.type === 'perdu';
    if (perdu) {
      const keptByJet = (DS.keptByRoll || []).reduce(
        (acc, g) => acc.concat((g.dice || []).map(v => ({ v, jet: g.jet, kept: true }))), []);
      const lost = (st.handLost || []).map(v => ({ v, jet: 0, kept: false }));
      let html = '';
      if (keptByJet.length) html += `<div class="dgroup"><small>Dés tenus</small><div class="div">${keptByJet.map(die).join('')}</div></div>`;
      if (lost.length) html += `<div class="dgroup"><small>Lancer perdant (aucun point)</small><div class="div">${lost.map(die).join('')}</div></div>`;
      return `<div class="dgrid">${html}</div>`;
    }
    if (st.type !== 'rolling') return '';
    const curJet = st.lancers || 1;
    const keptCur = (st.kept || []);
    const current = (st.inHand || []).map(v => ({ v, jet: curJet, kept: keptCur.includes(v) }));
    const keptByJet = (DS.keptByRoll || []).reduce(
      (acc, g) => acc.concat((g.dice || []).map(v => ({ v, jet: g.jet, kept: true }))), []);
    let html = '';
    if (keptByJet.length) html += `<div class="dgroup"><small>Dés tenus (${keptByJet.length})</small><div class="div">${keptByJet.map(die).join('')}</div></div>`;
    html += `<div class="dgroup"><small>Lancer n°${curJet}</small><div class="div">${current.map(die).join('')}</div></div>`;
    if (!current.length && !keptByJet.length) return '';
    return `<div class="dgrid">${html}</div>
      ${dHint(st) ? `<p class="dhint">${dHint(st)}</p>` : ''}`;
  }

  function dHint(st) {
    if (st.allScored) return 'Tous les dés ont rapporté : on relance les 6 dés.';
    const n = (st.toRoll || []).length;
    if (n === 0) return '';
    return n + ' dé' + (n > 1 ? 's' : '') + ' à relancer';
  }

  function viewRowDes(p, i) {
    const active = i === DS.current && DS.winner === null;
    const won = i === DS.winner;
    const rem = DES_TARGET - p.score;
    return `<section class="row${active ? ' active' : ''}${won ? ' won' : ''}" id="drow-${i}">
      <div class="who">
        <div class="namewrap"><span class="dot"></span>
          <input class="name" id="dname-${i}" data-dname="${i}" value="${esc(DS.names[i])}" aria-label="Nom du joueur ${i + 1} (dés)" autocomplete="off"></div>
        <div class="meta">
          ${p.last !== null ? `<span class="last">Dernier : +${fmt(p.last)}</span>` : ''}
          ${rem < DES_TARGET ? `<span class="hint">Reste ${fmt(rem)}</span>` : `<span class="hint">Objectif ${fmt(DES_TARGET)}</span>`}
        </div>
      </div>
      <div class="nums">
        <div class="num"><small>Points</small><b>${fmt(p.score)}</b></div>
        <div class="num rem"><small>Restant</small><b>${won ? 'Gagnant!' : fmt(rem)}</b></div>
      </div>
    </section>`;
  }

  // Panneau du bas (plateau de dés) — interface fixe : même structure dans tous
  // les états (idle, lancer, vol, perdu). Le bouton principal du haut lance ou
  // relance les dés ; le bouton du bas encaisse ; sur une perte on passe au suivant.
  function dPanel() {
    const st = DS.turn;               // TurnDice state ou null (idle)
    const p = DS.players[DS.current];
    const playerName = esc(DS.names[DS.current]);
    const currentPhase = DS.phase;
    const isIdle = !st;
    const isSteal = currentPhase === 'steal';
    const nextName = DS.names.length ? esc(DS.names[dNext(DS.current)]) : '';

    // En-tête commun + bouton principal (haut à droite, coloré) + badge « dés à tirer ».
    // Nombre de dés qu'on va relancer : les non gardés du lancer courant ; en
    // main pleine (allScored) on relance les 6.
    let diceLeft = 0;
    let topBtn, topLabel, topAction;
    if (isIdle) {
      topLabel = '🎲 Lancer les dés';
      topAction = 'lancier';
      diceLeft = 6;
    } else if (st.type === 'perdu') {
      topLabel = '';
      topAction = '';
    } else {
      topLabel = '🎲 Relancer les dés';
      topAction = 'rolldes';
      diceLeft = st.allScored ? 6 : ((st.toRoll || []).length);
    }
    const diceBadge = topAction
      ? `<span class="diceleft" title="Nombre de dés qui seront lancés">${diceLeft} dés</span>`
      : '';
    topBtn = topAction
      ? `<div class="topctr">${diceBadge}<button class="reroll" data-a="${topAction}" ${st && st.type !== 'rolling' ? 'disabled' : ''}>${topLabel}</button></div>`
      : '';

    // Total + état du tour.
    const totalShown = isIdle ? 0 : (st.type === 'perdu' ? 0 : (st.score || 0));
    const label1 = isIdle ? 'Au tour de' : 'Tour de';
    const stateTxt = isIdle
      ? `<div class="dstate">Joueur prêt à lancer.</div>`
      : (st.type === 'perdu' ? `<div class="dstate"><b>${playerName}</b> a perdu ce tour (aucun point).</div>`
        : st.type === 'rolling' ? `<div class="dstate">${isSteal
            ? `<b>Vol</b> — dés restants de ${esc(DS.names[DS.steal.sourcePlayer])} · gain ${fmt(DS.steal.gainToSteal)}. Production minimale : ${fmt(isSteal ? DES_VOL_MIN_PROD : T.OUVRAGE)}.`
            : `<b>Lancer n°${st.lancers}</b> · ${p.score > 0
                ? (isSteal ? `production minimale ${fmt(DES_VOL_MIN_PROD)}` : 'encaissable dès 1 point')
                : 'premier score : ' + fmt(T.OUVRAGE) + ' minimum'}.`}</div>`
        : `<div class="dstate"><b>${playerName}</b> encaisse ${fmt(st.total)}.</div>`);

    // Bandeau « main pleine ».
    const allScoredBanner = (st && st.type === 'rolling' && st.allScored)
      ? `<div class="dmsg good">🎲 Tous les dés ont rapporté : relance les 6 dés (le total du tour augmentera).</div>` : (isIdle && dVolOffer())
      ? `<div class="dmsg good">🔓 Vol possible : partir des dés restants de <b>${esc(DS.names[DS.prevTurn.player])}</b> (gain ${fmt(DS.prevTurn.gain)} à copier).</div>`
      : '';

    // Seuil d'encaissement : 1000 seulement pour le PREMIER score d'un joueur ;
    // ensuite il peut encaisser son tour dès 1 point.
    const openReq = isSteal ? DES_VOL_MIN_PROD : (p.score > 0 ? 1 : T.OUVRAGE);

    // Bouton(s) du bas.
    let bottom;
    if (isIdle) {
      const offer = dVolOffer();
      // En état idle, le bouton « Lancer » est déjà en haut à droite (.reroll).
      // On ne garde en bas que l'option de vol quand elle est possible.
      if (offer) {
        bottom = `<div class="actions"><button class="act pass" data-a="volerd">Voler ${fmt(DS.prevTurn.gain)}</button></div>`;
      } else {
        bottom = '';
      }
    } else if (st.type === 'perdu') {
      bottom = `<button class="act ok" style="width:100%" data-a="dasser">Passer à ${nextName}</button>`;
    } else {
      const canTake = st.type === 'rolling' && st.score >= openReq;
      const stopLabel = isSteal ? 'Prendre le vol' : 'Arrêter & encaisser';
      const canTakeHint = (st.type === 'rolling' && !canTake)
        ? `<p class="dhint">${isSteal ? 'Il faut ' + fmt(DES_VOL_MIN_PROD) + ' points produits pour encaisser le vol.'
            : (p.score > 0 ? 'Tu peux encaisser dès 1 point — appuie sur Relancer ou Arrêter.'
              : 'C\'est ton premier score : il faut '+fmt(T.OUVRAGE)+' points pour pouvoir encaisser.')}</p>` : '';
      bottom = `${canTakeHint}
        <div class="actions"><button class="act ok" data-a="stopdes" ${canTake ? '' : 'disabled'}>${stopLabel}</button></div>`;
    }

    return `<footer class="panel" id="panel">
      ${msg ? `<div class="msg ${msg.kind}" role="alert">${ICON.info}<div><strong>${esc(msg.title)}</strong>${esc(msg.text)}</div></div>` : ''}
      <div class="dice-wrap">
        <div>
          <div class="label">${label1} <b>${playerName}</b></div>
          <div class="dturn">
            <span class="dlab">Tour</span><span class="damt">${fmt(totalShown)}</span>
            ${st && st.type === 'rolling' && st.gained ? `<span class="dgain">(+${fmt(st.gained)} ce lancer)</span>` : ''}
          </div>
          ${stateTxt}
        </div>
        ${topBtn}
      </div>
      ${allScoredBanner}
      ${diceRow(st)}
      ${(isIdle && !dVolOffer()) ? `<p class="dsub">Tu as ${fmt(DES_TARGET - p.score)} points · objectif ${fmt(DES_TARGET)}.</p>` : ''}
      ${bottom}
    </footer>`;
  }

  function viewGameDes() {
    const w = DS.winner;
    return `<div class="app">
      <header class="top">
        <h1>20K <span>Dés</span></h1>
        <div class="tools">
          <button class="tool" data-a="gotab" aria-label="Revenir au mode tableau" title="Mode tableau">Tableau</button>
          <button class="tool" data-a="deslog" aria-label="Exporter l'historique des jets" title="Exporter jets">Historique</button>
          <button class="tool sound" data-a="sound" aria-label="${S.sound === false ? 'Activer le son' : 'Couper le son'}" title="${S.sound === false ? 'Son coupé' : 'Son activé'}">${S.sound === false ? ICON.mute : ICON.sound}</button>
          <button class="tool" data-a="desnew" title="Nouvelle partie aux dés">Nouveau</button>
        </div>
      </header>
      ${w !== null ? `<div class="win">
        <h2>🏆 ${esc(DS.names[w])} gagne avec ${fmt(DS.players[w].score)} points!</h2>
        <div class="btns">
          <button class="replay" data-a="start">Rejouer</button>
          <button class="fresh" data-a="desnew">Nouveau jeu</button>
        </div></div>` : ''}
      <main class="list">${DS.players.map(viewRowDes).join('')}</main>
      ${w === null ? dPanel() : ''}
      ${DS.jetLog.length ? `<details class="des-log" open><summary>Jets (${DS.jetLog.length}) · derniers en haut</summary>
        <p class="dloghead">Partie #${DS.gameId} · version ${esc(VERSION)} · du plus récent au plus ancien</p>
        ${DS.jetLog.slice().reverse().map(e => {
          const nm = esc(DS.names[e.p] || `Joueur ${e.p + 1}`);
          const kindLabel = e.kind === 'bank' ? 'ENC.' : e.kind === 'vol-bank' ? 'VOL ENC.' : e.kind === 'perdu' ? 'PERDU' : 'jet';
          const comb = e.comb ? ` · ${esc(e.comb)}` : '';
          const cls = e.kind === 'perdu' ? ' none' : (e.kind === 'bank' || e.kind === 'vol-bank') ? ' vol' : ' lv';
          const c = e.color || '#999';
          const dice = (e.dice || []).map(d => `<span style="color:${c}">${dGlyph(d)}</span>`).join(' ');
          return `<div class="djetrow"><span class="ln">T${e.n || 0}.${e.j > 0 ? e.j : ''}</span>
            <span class="lnm">${nm}</span>
            <span class="ddice-mini">${dice || '·'}</span>
            <span class="lv${cls}">${kindLabel} ${fmt(e.gained || 0)}${comb}</span>
            <span class="ls">= ${fmt(e.cumul || 0)}</span></div>`;
        }).join('')}</details>` : ''}
    </div>`;
  }

  function viewSetupDes() {
    const counts = [2, 3, 4, 5, 6].map(n =>
      `<button data-a="count" data-v="${n}" aria-pressed="${DS.count === n}">${n}</button>`).join('');
    const resumableDes = () => DS.players.length > 0 && DS.winner === null;
    const resume = resumableDes();
    const lead = DS.players.slice(0, 4).map((p, i) =>
      `${esc(DS.names[i] || 'Joueur ' + (i + 1))} ${fmt(p.score)}`).join(' · ');
    return `<div class="app"><div class="setup">
      <h1>20K <span>aux dés</span></h1>
      <div class="modes">
        <button class="mode" data-a="gotab">Tableau</button>
        <button class="mode" aria-pressed="true">Avec dés</button>
      </div>
      ${resume ? `<button class="resume" data-a="dresume">
        <span class="rt"><b>Reprendre la partie en cours</b>
        <small>${lead}${DS.players.length > 4 ? ' …' : ''}</small></span>${ICON.chev}
      </button>` : ''}
      <div><h2>Nombre de joueurs</h2><div class="count">${counts}</div></div>
      <ul class="rules">
        <li>6 dés : garde les dés qui rapportent, relance le reste</li>
        <li>Ouverture <b>${fmt(1000)}</b> avant de pouvoir encaisser</li>
        <li>Vol permis à partir de <b>${fmt(3500)}</b></li>
        <li>Objectif exact : <b>${fmt(20000)}</b></li>
      </ul>
      <button class="go" data-a="start">Commencer la partie aux dés</button>
      <p class="version">Version ${VERSION}</p>
    </div></div>`;
  }

  function viewRow(p, i) {
    const active = i === S.current && S.winner === null;
    const won = i === S.winner;
    return `<section class="row${active ? ' active' : ''}${won ? ' won' : ''}" id="row-${i}">
      <div class="who">
        <div class="namewrap"><span class="dot"></span>
          <input class="name" id="name-${i}" data-name="${i}" value="${esc(S.names[i])}" aria-label="Nom du joueur ${i + 1}" autocomplete="off"></div>
        <div class="meta">
          ${p.last !== null ? `<span class="last">Dernier : +${fmt(p.last)}</span>` : ''}
          ${!p.started ? `<span class="hint">Minimum ${fmt(MIN_OPEN)} pour commencer</span>` : ''}
        </div>
      </div>
      <div class="nums">
        <div class="num"><small>Points</small><b>${fmt(p.score)}</b></div>
        <div class="num rem"><small>Restant</small><b>${won ? 'Gagnant!' : fmt(TARGET - p.score)}</b></div>
      </div>
    </section>`;
  }

  function viewPanel() {
    const t = S.turn, total = t.stolen + t.add, vol = E.canVol(S);
    const p = S.players[S.current];
    const volTitle = E.volReason(S);
    const turnHtml = t.stolen
      ? `<span class="stolen">${ICON.lock}<small>VOL</small>${fmt(t.stolen)}</span>
         <span class="plus${t.add ? '' : ' zero'}">+ ${fmt(t.add)}</span>`
      : `<span class="base">${fmt(t.add)}</span>`;
    const clearLabel = t.add ? 'Effacer' : t.stolen ? 'Annuler le vol' : '';
    const left = TARGET - p.score, maxAdd = Math.max(0, left - t.stolen);
    return `<footer class="panel" id="panel">
      ${msg ? `<div class="msg ${msg.kind}" role="alert">${ICON.info}<div><strong>${msg.title}</strong>${esc(msg.text)}</div></div>` : ''}
      <div class="turnline">
        <div>
          <div class="label">Tour actuel · <b>${esc(S.names[S.current])}</b></div>
          <div class="turn">${turnHtml}</div>
          <div class="total">${t.stolen
            ? `Total <b>${fmt(total)}</b> · reste <b>${fmt(left)}</b> · max +<b>${fmt(maxAdd)}</b>`
            : `Reste <b>${fmt(left)}</b>`}</div>
        </div>
        ${clearLabel ? `<button class="clear" data-a="clear">${clearLabel}</button>` : ''}
      </div>
      <div class="keys">
        ${STEPS.map(n => `<button class="key" data-a="add" data-v="${n}">+${n}</button>`).join('')}
        <button class="key vol${pulseVol && vol ? ' pulse' : ''}" data-a="vol" ${vol ? '' : 'disabled'} title="${volTitle}" aria-label="Vol : ${volTitle}">VOL</button>
      </div>
      ${vol ? '' : `<p class="volhint">${ICON.lock}<span>${volTitle}</span></p>`}
      <div class="actions">
        <button class="act pass" data-a="pass">Aucun point</button>
        <button class="act ok" data-a="submit" ${total ? '' : 'disabled'}>Ajouter au score</button>
      </div>
    </footer>`;
  }

  function viewGame() {
    const w = S.winner;
    return `<div class="app">
      <header class="top">
        <h1>20K <span>Scorecard</span></h1>
        <div class="tools">
          <button class="tool icon undo" data-a="undo" aria-label="Annuler le dernier tour" title="Annuler" ${S.past.length ? '' : 'disabled'}>${ICON.undo}</button>
          <button class="tool icon redo" data-a="redo" aria-label="Refaire le tour annulé" title="Refaire" ${S.future.length ? '' : 'disabled'}>${ICON.redo}</button>
          <button class="tool icon" data-a="log" aria-label="Historique des tours" title="Historique">${ICON.log}</button>
          <button class="tool sound" data-a="sound" aria-label="${S.sound === false ? 'Activer le son' : 'Couper le son'}" title="${S.sound === false ? 'Son coupé' : 'Son activé'}">${S.sound === false ? ICON.mute : ICON.sound}</button>
          <button class="tool${confirmNew ? ' danger' : ''}" data-a="new">${confirmNew ? 'Confirmer ?' : 'Nouveau<span class="nj"> jeu</span>'}</button>
        </div>
      </header>
      ${w !== null ? `<div class="win">
        <h2>🏆 ${esc(S.names[w])} gagne avec ${fmt(S.players[w].score)} points!</h2>
        <div class="btns">
          <button class="replay" data-a="replay">Rejouer avec les mêmes joueurs</button>
          <button class="fresh" data-a="new">Nouveau jeu</button>
        </div></div>` : ''}
      <main class="list">${S.players.map(viewRow).join('')}</main>
      ${w === null ? viewPanel() : ''}
    </div>`;
  }

  function viewSheet() {
    const rows = S.log.slice().reverse();
    const body = rows.length ? rows.map(e => {
      const nm = esc(S.names[e.i] || `Joueur ${e.i + 1}`);
      const v = e.pass ? 'Aucun point'
        : e.stolen ? `Vol ${fmt(e.stolen)} + ${fmt(e.add)}`
        : `+${fmt(e.add)}`;
      const cls = e.pass ? ' none' : e.stolen ? ' vol' : '';
      return `<div class="logrow"><span class="ln">${e.n}</span><span class="lnm">${nm}</span>
        <span class="lv${cls}">${v}</span><span class="ls">${fmt(e.after)}</span></div>`;
    }).join('') : '<p class="empty">Aucun tour joué pour le moment.</p>';
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Historique des tours">
      <header class="sheet-top"><h2>Historique</h2>
        <button class="tool icon" data-a="closelog" aria-label="Fermer l'historique">${ICON.close}</button></header>
      <div class="sheet-body">
        ${rows.length ? '<div class="loghead"><span>#</span><span>Joueur</span><span>Tour</span><span>Total</span></div>' : ''}
        ${body}
      </div>
    </div>`;
  }

  const root = document.getElementById('root');
  function render() {
    if (inDesMode()) {
      root.innerHTML = DS.screen === 'game-des' ? viewGameDes() : viewSetupDes();
      const panel = document.getElementById('panel');
      document.documentElement.style.setProperty('--panel-h', (panel ? panel.offsetHeight : 0) + 'px');
      return;
    }
    root.innerHTML = (S.screen === 'setup' ? viewSetup() : viewGame()) + (sheet ? viewSheet() : '');
    const panel = document.getElementById('panel');
    document.documentElement.style.setProperty('--panel-h', (panel ? panel.offsetHeight : 0) + 'px');
  }
  function renameDes(i, name) {
    if (i >= 0 && i < DS.names.length) { DS.names[i] = String(name == null ? '' : name); saveDes(); }
  }
  function scrollToActive() {
    const el = document.getElementById('row-' + S.current);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (S.sound !== false) { audio(); unlockSpeech(); }
    if (b && !b.disabled) { if (inDesMode()) dAct(b.dataset.a, b.dataset.v); else act(b.dataset.a, b.dataset.v); }
  });
  document.addEventListener('input', e => {
    const i = e.target.dataset && e.target.dataset.name;
    if (i !== undefined) {
      Object.assign(S, E.reduce(S, { type: 'rename', i: +i, name: e.target.value }).state);
      save();
    }
    const di = e.target.dataset && e.target.dataset.dname;
    if (di !== undefined && inDesMode()) renameDes(+di, e.target.value);
  });
  document.addEventListener('change', e => {
    const i = e.target.dataset && e.target.dataset.name;
    if (i !== undefined && !e.target.value.trim()) {
      Object.assign(S, E.reduce(S, { type: 'rename', i: +i, name: `Joueur ${+i + 1}` }).state);
      save(); render();
    }
    const di = e.target.dataset && e.target.dataset.dname;
    if (di !== undefined && inDesMode() && !e.target.value.trim()) {
      renameDes(+di, `Joueur ${+di + 1}`); render();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheet) { sheet = null; render(); }
  });
  window.addEventListener('resize', () => {
    const panel = document.getElementById('panel');
    if (panel) document.documentElement.style.setProperty('--panel-h', panel.offsetHeight + 'px');
  });

  // Keep the screen on while a game is open (ignored where unsupported).
  let wake = null;
  async function keepAwake() {
    try {
      if ((S.screen === 'game' || DS.screen === 'game-des') && 'wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  render();
  keepAwake();
})();

</script>
</body>
